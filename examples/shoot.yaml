apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  extensions:
    - type: otelcol
      providerConfig:
        apiVersion: otelcol.extensions.gardener.cloud/v1alpha1
        kind: CollectorConfig
        spec:
          # Exporter-oriented configuration. Each entry in `targets` pairs a
          # self-contained exporter with the signals it receives ("logs",
          # "metrics" and/or "events") and an optional filters.
          #
          # An exporter enables one or more transports (`otlp_http`, `otlp_grpc`,
          # `debug`); a target's signal pipelines fan out to all enabled
          # transports. Each OTLP transport must set an endpoint.
          #
          # "filters" is an opaque OpenTelemetry filterprocessor configuration
          # applied to all of the target's signals, validated against the
          # upstream filterprocessor.
          targets:
            # First destination: a remote collector over HTTP receiving both
            # logs and metrics, with a metrics-only filter.
            - exporter:
                otlp_http:
                  endpoint: "https://opentelemetry-receiver.default.svc.cluster.local:4318"
                  compression: gzip  # gzip, zstd, snappy or none
                  encoding: proto  # proto or json
                  token:
                    resourceRef:
                      name: otelcol-bearer-token
                      dataKey: token
                  tls:
                    ca:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: ca.crt
                    cert:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: client.crt
                    key:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: client.key
              signals: [logs, metrics]
              filters:
                error_mode: ignore  # ignore, silent or propagate
                metrics:
                  # OTTL condition style (mutually exclusive with include/exclude)
                  resource:
                    - resource.attributes["env"] == "dev"
                  metric:
                    - metric.name == "some.unwanted.metric"
                  datapoint:
                    - value_int == 0

            # Second destination: a debug exporter writing to the collector logs.
            # The debug transport ignores endpoint/tls/token; only verbosity is
            # considered.
            - exporter:
                debug:
                  verbosity: basic  # basic, normal or detailed
              signals: [logs]

            # Third destination: ship Kubernetes events over gRPC.
            - exporter:
                otlp_grpc:
                  endpoint: "https://opentelemetry-receiver.default.svc.cluster.local:4317"
                  token:
                    resourceRef
                      name: otelcol-bearer-token
                      dataKey: token
                  tls:
                    ca:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: ca.crt
                    cert:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: client.crt
                    key:
                      resourceRef:
                        name: otelcol-tls
                        dataKey: client.key
              signals: [events]

          # Collector's own internal log settings.
          logs:
            level: INFO  # INFO, WARN, ERROR or DEBUG
            encoding: console  # console or json

          # Collector's own internal metrics settings.
          metrics:
            level: normal  # none, basic, normal or detailed
  resources:
  - name: otelcol-bearer-token
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: my-otelcol-bearer-token
  - name: otelcol-tls
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: my-otelcol-tls
  cloudProfile:
    name: local
    kind: CloudProfile
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
      - name: local
        machine:
          type: local
        cri:
          name: containerd
        minimum: 1
        maximum: 2
        maxSurge: 1
        maxUnavailable: 0
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
