apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  extensions:
    - type: otelcol
      providerConfig:
        apiVersion: otelcol.extensions.gardener.cloud/v1alpha1
        kind: CollectorConfig
        spec:
          # Exporter-oriented configuration. Each entry in `targets` pairs a
          # self-contained exporter with the signals it receives ("logs",
          # "metrics" and/or "events") and an optional ordered list of filter
          # rules. Each (target, signal) pair becomes one collector pipeline, so
          # a target can fan out several signals to one destination, and a signal
          # can fan out to several targets. A signal is enabled iff at least one
          # target lists it. Every non-debug target must set an endpoint.
          #
          # Filter rules mirror the OTel filterprocessor, keyed by signal
          # ("metrics"/"logs"); a "metrics" block feeds the target's metrics
          # pipeline, a "logs" block its logs and events pipelines. See:
          # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/filterprocessor
          targets:
            # First destination: a remote collector over HTTP receiving both
            # logs and metrics, with a metrics-only filter.
            - exporter:
                protocol: http  # http or grpc
                endpoint: "https://opentelemetry-receiver.default.svc.cluster.local:4318"
                compression: gzip  # gzip, zstd, snappy or none
                encoding: proto  # proto or json (http only)
                token:
                  resourceRef:
                    name: otelcol-bearer-token
                    dataKey: token
                tls:
                  ca:
                    resourceRef:
                      name: otelcol-tls
                      dataKey: ca.crt
                  cert:
                    resourceRef:
                      name: otelcol-tls
                      dataKey: client.crt
                  key:
                    resourceRef:
                      name: otelcol-tls
                      dataKey: client.key
              signals: [logs, metrics]
              # filters:
              #   - error_mode: ignore  # ignore, silent or propagate
              #     # The metrics block feeds the metrics pipeline.
              #     metrics:
              #       # OTTL condition style (mutually exclusive with include/exclude)
              #       resource:
              #         - resource.attributes["env"] == "dev"
              #       metric:
              #         - metric.name == "some.unwanted.metric"
              #       datapoint:
              #         - value_int == 0
              #       # Object/match style (mutually exclusive with the lists above)
              #       # include:
              #       #   match_type: strict  # strict or regexp
              #       #   metric_names: ["metric.a", "metric.b"]
              #       # Alternatively, the context-inferred condition style:
              #       # metric_conditions:
              #       #   - context: datapoint  # optional; inferred when omitted
              #       #     error_mode: ignore  # optional
              #       #     conditions:
              #       #       - metric.name == "some.unwanted.metric"
              #     # The logs block feeds the logs and events pipelines.
              #     logs:
              #       log_record:
              #         - IsMatch(log.body, ".*password.*")
              #       # include:
              #       #   match_type: strict
              #       #   severity_texts: ["INFO", "DEBUG"]
              #       #   severity_number:
              #       #     min: WARN
              #       #     match_undefined: false

            # Second destination: a debug exporter writing to the collector logs.
            # protocol: debug ignores endpoint/tls/token; only verbosity is
            # honored.
            - exporter:
                protocol: debug
                verbosity: basic  # basic, normal or detailed
              signals: [logs]

            # Third destination: ship Kubernetes events over gRPC.
            - exporter:
                protocol: grpc
                endpoint: "https://opentelemetry-receiver.default.svc.cluster.local:4317"
              signals: [events]

          # Collector's own internal log settings (not a signal).
          logs:
            level: INFO  # INFO, WARN, ERROR or DEBUG
            encoding: console  # console or json

          # Collector's own internal metrics settings (not a signal).
          metrics:
            level: normal  # none, basic, normal or detailed
  resources:
  - name: otelcol-bearer-token
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: my-otelcol-bearer-token
  - name: otelcol-tls
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: my-otelcol-tls
  cloudProfile:
    name: local
    kind: CloudProfile
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    # Must be within 10.0.0.0/16 (subnet of kind pod CIDR 10.0.0.0/15, but disjoint with seed pod CIDR 10.1.0.0/16).
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
      - name: local
        machine:
          type: local
        cri:
          name: containerd
        minimum: 1
        maximum: 2
        maxSurge: 1
        maxUnavailable: 0
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
